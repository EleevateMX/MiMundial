<!--
  Mi Mundial — "Reauthentication"
  Supabase → Authentication → Email Templates → Reauthentication
  Asunto: Tu código de verificación de Mi Mundial ⚽
  Variable: {{ .Token }} (código de 6 dígitos)
-->
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
  </head>
  <body style="margin:0;padding:0;background:#0b0e17;font-family:Arial,Helvetica,sans-serif;color:#f5f7ff;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0b0e17;padding:24px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;width:100%;background:#11162a;border:1px solid rgba(255,255,255,0.08);border-radius:20px;overflow:hidden;">
            <tr>
              <td style="padding:30px 26px;text-align:center;">
                <div style="font-size:13px;letter-spacing:3px;color:#2bf5c0;text-transform:uppercase;">⚽ Mi Mundial</div>
                <h1 style="margin:10px 0 0;font-size:26px;line-height:1.2;color:#ffd24a;">Tu código de verificación</h1>
                <p style="color:#c9cede;font-size:15px;line-height:1.55;margin:14px 0 22px;">
                  Para confirmar tu identidad en <strong>Mi Mundial</strong>, usa este código:
                </p>
                <div style="display:inline-block;background:#0b0e17;border:1px solid rgba(255,210,74,0.4);border-radius:14px;padding:14px 22px;font-size:30px;font-weight:bold;letter-spacing:10px;color:#ffd24a;">{{ .Token }}</div>
                <p style="color:#8a90a6;font-size:12px;margin:22px 0 0;line-height:1.5;">
                  El código vence en unos minutos. No lo compartas con nadie.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:16px;text-align:center;border-top:1px solid rgba(255,255,255,0.08);">
                <p style="color:#6b7180;font-size:11px;margin:0;line-height:1.5;">
                  Mi Mundial · Solo predicciones, sin apuestas.<br />
                  Si no fuiste tú, ignora este correo.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
